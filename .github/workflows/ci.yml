name: Build_ML_model

on:
  # pull_request:
  push: # branches: [main]
    branches: [feature/*, main, release/*]
  workflow_dispatch:
      environment:
        name: development
        

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

  directory-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for required directories
        run: |
          required_dirs=("data" "models" "src")
          for dir in "${required_dirs[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "Error: Required directory '$dir' is missing."
              exit 1
            fi
          done

    install-dependencies_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          requirements: requirements-dev.txt



