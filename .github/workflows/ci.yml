name: Build_ML_model

on:
  push:
    branches: [feature/*, main, release/*]
  workflow_dispatch:
    environment:
      name: development

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: List files in project directory
        run: ls -la Week9-10/files/ml_cicd_project

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Week9-10/files/ml_cicd_project
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "Week9-10/files/ml_cicd_project/requirements*.txt"
      - run: pip install -r requirements-dev.txt
      # - run: ruff check .
      # - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Week9-10/files/ml_cicd_project
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: "Week9-10/files/ml_cicd_project/requirements*.txt"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - uses: actions/upload-artifact@v7
        if: matrix.python-version == '3.11'
        with:
          name: coverage-report
          path: Week9-10/files/ml_cicd_project/coverage.xml

  model-check:
    needs: [lint, test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Week9-10/files/ml_cicd_project
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "Week9-10/files/ml_cicd_project/requirements*.txt"
      - run: pip install -r requirements.txt
      - name: Train the model
        run: python -m src.train
      - name: Quality gate (minimum AUC)
        run: python scripts/check_metrics.py --min-auc 0.75
      - uses: actions/upload-artifact@v7
        with:
          name: model
          path: Week9-10/files/ml_cicd_project/models/
