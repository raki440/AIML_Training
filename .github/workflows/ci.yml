name: Build_ML_model
on:
  push:
    branches:
      - main
      - "feature/*"
      - "release/*"
      - "homework/**"
    tags:
      - "v*"

  pull_request:
    branches: [main]

  workflow_dispatch:

  schedule:
    - cron: "30 18 * * *"

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: List files in project directory
        run: ls -la Week9-10/files/ml_cicd_project

  lint:
    runs-on: ubuntu-latest
    needs: code-checkout
    defaults:
      run:
        working-directory: Week9-10/files/ml_cicd_project
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "Week9-10/files/ml_cicd_project/requirements*.txt"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  build_and_push_docker_image:
    runs-on: ubuntu-latest
    needs: [code-checkout, lint]
    steps:
      - uses: actions/checkout@v7
      - name: Lowercase the image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
      - uses: docker/build-push-action@v7
        with:
          context: ./Week9-10/files/ml_cicd_project
          file: ./Week9-10/files/ml_cicd_project/Dockerfile
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  test:
    runs-on: ubuntu-latest
    needs: [code-checkout, lint]
    defaults:
      run:
        working-directory: Week9-10/files/ml_cicd_project
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: "Week9-10/files/ml_cicd_project/requirements*.txt"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - uses: actions/upload-artifact@v7
        if: matrix.python-version == '3.11'
        with:
          name: coverage-report
          path: Week9-10/files/ml_cicd_project/coverage.xml

  model-check:
    needs: [lint, test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Week9-10/files/ml_cicd_project
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "Week9-10/files/ml_cicd_project/requirements*.txt"
      - run: pip install -r requirements.txt
      - name: Train the model
        run: python -m src.train
      - name: Quality gate (minimum AUC)
        run: python scripts/check_metrics.py --min-auc 0.75
      - uses: actions/upload-artifact@v7
        with:
          name: model
          path: Week9-10/files/ml_cicd_project/models/





